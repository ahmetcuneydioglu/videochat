services:
  - type: web
    name: omegpt-backend
    runtime: node
    rootDir: .
    buildCommand: npm install
    startCommand: node server/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: GOOGLE_CLIENT_IDS
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://www.omegpt.com,https://omegpt.com
      - key: APPLE_ISSUER_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_BUNDLE_ID
        sync: false
      - key: APPLE_PRIVATE_KEY_BASE64
        sync: false
